
name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: pakialakshmi
        run: |
          mkdir -p dist

          python - <<'PY'
          import os
          import json
          import urllib.request
          import html

          username = os.environ["GH_USERNAME"]
          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "User-Agent": "GitHub-Profile-Stats",
              "Accept": "application/vnd.github+json"
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def api(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          user = api(f"https://api.github.com/users/{username}")
          repos = user["public_repos"]

          contributions = 0
          if token:
              query = {
                  "query": """
                  query($login: String!) {
                    user(login: $login) {
                      contributionsCollection {
                        contributionCalendar {
                          totalContributions
                        }
                      }
                    }
                  }
                  """,
                  "variables": {"login": username}
              }
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps(query).encode(),
                  headers={
                      **headers,
                      "Content-Type": "application/json"
                  }
              )
              with urllib.request.urlopen(req) as r:
                  result = json.load(r)
              contributions = result["data"]["user"][
                  "contributionsCollection"
              ]["contributionCalendar"]["totalContributions"]

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="830" height="236" viewBox="0 0 830 236">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3b0a27"/>
              <stop offset=".55" stop-color="#14060f"/>
              <stop offset="1" stop-color="#090408"/>
            </linearGradient>
            <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2e0b20"/>
              <stop offset="1" stop-color="#12060d"/>
            </linearGradient>
            <linearGradient id="ln" x1="0" x2="1">
              <stop offset="0" stop-color="#ec4899"/>
              <stop offset="1" stop-color="#ec489900"/>
            </linearGradient>
            <radialGradient id="gl" cx=".8" cy=".1" r=".7">
              <stop offset="0" stop-color="#db2777" stop-opacity=".35"/>
              <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="830" height="236" fill="url(#bg)"/>
          <rect width="830" height="236" fill="url(#gl)"/>
          <text x="4" y="28" font-size="11" fill="#f472b6" font-family="monospace" letter-spacing="1.5" font-weight="700">07 · COMMIT LOG</text>
          <text x="4" y="72" font-size="36" fill="#fff7fb" font-family="Georgia,serif" font-weight="700">A year of building.</text>
          <rect x="4" y="86" width="260" height="2.5" rx="1" fill="url(#ln)"/>
          <rect x="1" y="108" width="266" height="110" rx="14" fill="url(#cg)" stroke="#7a1d4f" stroke-width="1.5"/>
          <text x="20" y="136" font-size="10.5" fill="#f472b6" font-family="monospace" letter-spacing="1.5">CONTRIBUTIONS</text>
          <text x="20" y="181" font-size="38" fill="#fff7fb" font-family="Georgia,serif" font-weight="700">{contributions:,}</text>
          <text x="20" y="206" font-size="9.5" fill="#b8849d" font-family="monospace" letter-spacing="1.5">LAST 12 MONTHS</text>
          <rect x="283" y="108" width="266" height="110" rx="14" fill="url(#cg)" stroke="#7a1d4f" stroke-width="1.5"/>
          <text x="302" y="136" font-size="10.5" fill="#f472b6" font-family="monospace" letter-spacing="1.5">PUBLIC REPOSITORIES</text>
          <text x="302" y="181" font-size="38" fill="#fff7fb" font-family="Georgia,serif" font-weight="700">{repos}</text>
          <text x="302" y="206" font-size="9.5" fill="#b8849d" font-family="monospace" letter-spacing="1.5">PUBLIC</text>
          <rect x="565" y="108" width="266" height="110" rx="14" fill="url(#cg)" stroke="#7a1d4f" stroke-width="1.5"/>
          <text x="584" y="136" font-size="10.5" fill="#f472b6" font-family="monospace" letter-spacing="1.5">CURIOSITY</text>
          <text x="584" y="181" font-size="46" fill="#fff7fb" font-family="Georgia,serif" font-weight="700">∞</text>
          <text x="584" y="206" font-size="9.5" fill="#b8849d" font-family="monospace" letter-spacing="1.5">ALWAYS ON</text>
          </svg>'''

          with open("dist/commit-log.svg", "w") as f:
              f.write(svg)
          PY

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
