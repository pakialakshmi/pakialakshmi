  <text x="36" y="268">B.SC. CS</text>
  <text x="136" y="268">FRONTEND</text>
  <text x="237" y="268">ALWAYS LEARNING</text>
  <text x="395" y="268">CREATIVE</text>
</g>

<!-- Terminal panel -->
<rect x="558" y="110" width="248" height="166" rx="14" fill="url(#cg)" stroke="#DB2777" stroke-width="1.5"/>
<rect x="559" y="111" width="246" height="164" rx="13" fill="url(#gl)"/>

<g>
  <circle cx="582" cy="132" r="5.5" fill="#F472B6"/>
  <circle cx="602" cy="132" r="5.5" fill="#DB2777"/>
  <circle cx="622" cy="132" r="5.5" fill="#64133F"/>
</g>

<path d="M558 150 H806" stroke="#7A1D4F" stroke-opacity=".6"/>

<g font-size="11.5" font-family="Consolas,monospace" letter-spacing=".2">
