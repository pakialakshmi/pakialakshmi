
<svg xmlns="http://www.w3.org/2000/svg" width="830" height="290" viewBox="0 0 830 290">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10040B"/>
    <stop offset=".55" stop-color="#080508"/>
    <stop offset="1" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#26091B"/>
    <stop offset="1" stop-color="#090409"/>
  </linearGradient>
  <linearGradient id="pinkLine" x1="0" x2="1">
    <stop offset="0" stop-color="#FF1493"/>
    <stop offset=".65" stop-color="#DB2777"/>
    <stop offset="1" stop-color="#DB277700"/>
  </linearGradient>
  <radialGradient id="glow" cx=".8" cy=".1" r=".8">
    <stop offset="0" stop-color="#DB2777" stop-opacity=".18"/>
    <stop offset="1" stop-color="#DB2777" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="830" height="290" fill="url(#bg)"/>
<rect width="830" height="290" fill="url(#glow)"/>

<!-- About label -->
<text x="24" y="28" fill="#F472B6" font-size="11"
font-family="monospace" letter-spacing="1.5">01 · ABOUT</text>

<!-- Main heading -->
<text x="24" y="72" fill="#F472B6" font-size="36"
font-family="Georgia,serif" font-weight="bold">Hello, I'm Pakialakshmi.</text>

<rect x="24" y="86" width="290" height="3" rx="1.5" fill="url(#pinkLine)"/>

<!-- About paragraph -->
<g fill="#F5DCE8" font-size="16" font-family="Georgia,serif">
  <text x="24" y="130">A Computer Science student passionate about frontend</text>
  <text x="24" y="157">and web development. I enjoy building responsive</text>
  <text x="24" y="184">websites, exploring new technologies and creating</text>
  <text x="24" y="211">user-friendly interfaces.</text>
</g>

<!-- Skill tags -->
<g fill="#0A0508" stroke="#DB2777" stroke-width="1.3">
  <rect x="24" y="250" width="91" height="29" rx="5"/>
  <rect x="124" y="250" width="92" height="29" rx="5"/>
  <rect x="225" y="250" width="150" height="29" rx="5"/>
  <rect x="384" y="250" width="90" height="29" rx="5"/>
</g>

<g fill="#F9A8D4" font-size="10" font-family="monospace"
font-weight="bold" letter-spacing=".7">
  <text x="36" y="268">B.SC. CS</text>
  <text x="136" y="268">FRONTEND</text>
  <text x="237" y="268">ALWAYS LEARNING</text>
  <text x="395" y="268">CREATIVE</text>
</g>

<!-- Terminal window -->
<rect x="558" y="110" width="248" height="166" rx="14"
fill="url(#terminal)" stroke="#DB2777" stroke-width="1.5"/>

<path d="M559 150 H805" stroke="#7A1D4F" stroke-opacity=".7"/>

<circle cx="582" cy="132" r="5.5" fill="#F472B6"/>
<circle cx="602" cy="132" r="5.5" fill="#DB2777"/>
<circle cx="622" cy="132" r="5.5" fill="#64133F"/>

<g font-size="11.5" font-family="monospace">
  <text x="576" y="169" fill="#F472B6">$ whoami</text>
  <text x="576" y="189" fill="#F5E6EE">pakialakshmi</text>
  <text x="576" y="209" fill="#F472B6">$ cat focus.txt</text>
  <text x="576" y="229" fill="#F5E6EE">frontend · responsive · ui</text>
  <text x="576" y="249" fill="#F472B6">$ status</text>
  <text x="576" y="268" fill="#F5E6EE">always learning <tspan fill="#FF1493">▌</tspan></text>
</g>
</svg>


