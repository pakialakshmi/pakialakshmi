
<svg xmlns="http://www.w3.org/2000/svg" width="830" height="290" viewBox="0 0 830 290">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12050D"/>
    <stop offset=".55" stop-color="#080508"/>
    <stop offset="1" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#210817"/>
    <stop offset="1" stop-color="#080408"/>
  </linearGradient>
  <linearGradient id="ln" x1="0" x2="1">
