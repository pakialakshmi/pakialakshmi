</defs>

<!-- Black background -->
<rect width="830" height="290" fill="url(#bg)"/>
<rect width="830" height="290" fill="url(#gl)"/>

<!-- Section label -->
<text x="24" y="28" font-size="11" fill="#F472B6"
font-family="Consolas,monospace" letter-spacing="1.5" font-weight="700">01 · ABOUT</text>

<!-- Heading -->
<text x="24" y="72" font-size="36" fill="#F472B6"
font-family="Georgia,'Times New Roman',serif" font-weight="700">Hello, I'm Pakialakshmi.</text>

<rect x="24" y="86" width="290" height="3" rx="1.5" fill="url(#ln)"/>

<!-- Introduction -->
<g fill="#F5DCE8" font-size="16" font-family="Georgia,'Times New Roman',serif">
  <text x="24" y="130">A Computer Science student passionate about frontend</text>
  <text x="24" y="157">and web development. I enjoy building responsive</text>
  <text x="24" y="184">websites, exploring new technologies and creating</text>
  <text x="24" y="211">user-friendly interfaces.</text>
</g>

