
name: Generate Snake and Commit Log

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Commit Log SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, html
          from datetime import datetime, timedelta, timezone

          user = os.environ["GH_USER"]
          token = os.environ.get("GH_TOKEN", "")

          if not token:
              raise SystemExit("GH_TOKEN secret is missing. Add it in repository Settings > Secrets and variables > Actions.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "GitHub-Commit-Log"
          }

          now = datetime.now(timezone.utc)
          start = now - timedelta(days=365)

          query = {
              "query": """
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }
              """,
              "variables": {
                  "login": user,
                  "from": start.isoformat(),
                  "to": now.isoformat()
              }
          }

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps(query).encode(),
              headers=headers
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          if "errors" in data or not data.get("data", {}).get("user"):
              raise SystemExit("Could not retrieve contributions. Check the GH_TOKEN secret and token permissions.")

          contributions = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["totalContributions"]

          req = urllib.request.Request(
              f"https://api.github.com/users/{user}",
              headers={"User-Agent": "GitHub-Commit-Log"}
          )
          with urllib.request.urlopen(req) as response:
              repos = json.load(response)["public_repos"]

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#170b20"/>
                <stop offset="100%" stop-color="#09090f"/>
              </linearGradient>
              <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ff4fa3"/>
                <stop offset="100%" stop-color="#c084fc"/>
              </linearGradient>
            </defs>
            <rect width="900" height="190" rx="18" fill="url(#bg)" stroke="#66304f"/>
            <text x="32" y="42" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="bold">COMMIT LOG</text>
            <text x="32" y="65" fill="#c4a8c9" font-family="Arial,sans-serif" font-size="12">LIVE GITHUB ACTIVITY · LAST 365 DAYS</text>
            <rect x="32" y="82" width="836" height="1" fill="#40243f"/>
            <text x="32" y="120" fill="#ff79bd" font-family="Arial,sans-serif" font-size="12">CONTRIBUTIONS</text>
            <text x="32" y="160" fill="url(#pink)" font-family="Arial,sans-serif" font-size="36" font-weight="bold">{contributions:,}</text>
            <text x="475" y="120" fill="#ff79bd" font-family="Arial,sans-serif" font-size="12">PUBLIC REPOSITORIES</text>
            <text x="475" y="160" fill="url(#pink)" font-family="Arial,sans-serif" font-size="36" font-weight="bold">{repos}</text>
            <text x="868" y="178" text-anchor="end" fill="#927b9a" font-family="Arial,sans-serif" font-size="10">UPDATED DAILY</text>
          </svg>'''

          os.makedirs("dist", exist_ok=True)
          with open("dist/commit-log.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
